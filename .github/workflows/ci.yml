name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        run: go build -o arm-emulator

      - name: Run tests
        run: go test ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  swift-gui:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build Go backend
        run: make build

      - name: Install Swift tools
        run: |
          brew install xcodegen swiftlint xcbeautify

      # The runner image's Homebrew swiftformat lags the latest release.
      - name: Install latest SwiftFormat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo nicklockwood/SwiftFormat --pattern swiftformat.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version

      - name: Generate Xcode project
        working-directory: swift-gui
        run: xcodegen generate

      - name: Run SwiftFormat check
        working-directory: swift-gui
        run: swiftformat --lint .

      - name: Run SwiftLint
        working-directory: swift-gui
        run: swiftlint

      - name: Build Swift app
        working-directory: swift-gui
        run: xcodebuild -project ARMEmulator.xcodeproj -scheme ARMEmulator build | xcbeautify

      - name: Run Swift tests
        working-directory: swift-gui
        run: xcodebuild test -project ARMEmulator.xcodeproj -scheme ARMEmulator -destination 'platform=macOS' | xcbeautify

  avalonia-gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: avalonia-gui
        run: dotnet restore

      - name: Build Avalonia app
        working-directory: avalonia-gui
        run: dotnet build --no-restore

      - name: Set up Go
        if: runner.os != 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build Go backend
        if: runner.os != 'Windows'
        run: go build -o arm-emulator

      # The integration tests run against a backend started in this step, because the runner ends background
      # processes when a step finishes. Windows runs the unit and UI tests only.
      - name: Run Avalonia tests (with backend)
        if: runner.os != 'Windows'
        working-directory: avalonia-gui
        run: |
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("", 0)); print(s.getsockname()[1])')
          ../arm-emulator -api-server -port "$port" > ../backend.log 2>&1 &
          backend_pid=$!
          trap 'kill $backend_pid' EXIT
          for attempt in $(seq 1 50); do
            curl -sf "http://localhost:$port/health" && break
            sleep 0.2
          done
          curl -sf "http://localhost:$port/health" || { cat ../backend.log; exit 1; }
          ARM_EMULATOR_URL="http://localhost:$port" dotnet test --no-build --verbosity normal

      - name: Run Avalonia tests (without backend)
        if: runner.os == 'Windows'
        working-directory: avalonia-gui
        run: dotnet test --no-build --verbosity normal
