name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary_name: arm-emulator
          - os: darwin
            arch: arm64
            runner: macos-latest
            binary_name: arm-emulator
          - os: windows
            arch: amd64
            runner: windows-latest
            binary_name: arm-emulator.exe
          - os: windows
            arch: arm64
            runner: windows-latest
            binary_name: arm-emulator.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Building $VERSION (commit: $COMMIT, date: $DATE)"

      - name: Build CLI
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.Commit=${{ steps.version.outputs.commit }} -X main.Date=${{ steps.version.outputs.date }}" -o ${{ matrix.binary_name }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - name: Create release artifact name
        id: artifact
        shell: bash
        run: |
          # Map GOOS to user-friendly platform names
          case "${{ matrix.os }}" in
            darwin)
              PLATFORM="macos"
              ;;
            windows)
              PLATFORM="win"
              ;;
            linux)
              PLATFORM="linux"
              ;;
            *)
              PLATFORM="${{ matrix.os }}"
              ;;
          esac

          if [ "${{ matrix.os }}" = "windows" ]; then
            ARTIFACT_NAME="arm-emulator-${PLATFORM}-${{ matrix.arch }}.exe"
            cp ${{ matrix.binary_name }} "$ARTIFACT_NAME"
          else
            ARTIFACT_NAME="arm-emulator-${PLATFORM}-${{ matrix.arch }}"
            cp ${{ matrix.binary_name }} "$ARTIFACT_NAME"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksum
        id: checksum
        shell: bash
        run: |
          ARTIFACT_NAME="${{ steps.artifact.outputs.artifact_name }}"
          CHECKSUM_FILE="${ARTIFACT_NAME}.sha256"

          # Generate SHA256 checksum in standard format (hash  filename)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Use PowerShell to extract hash more reliably
            HASH=$(powershell -Command "(Get-FileHash -Algorithm SHA256 '$ARTIFACT_NAME').Hash.ToLower()")
            echo "$HASH  $ARTIFACT_NAME" > "$CHECKSUM_FILE"
          else
            shasum -a 256 "$ARTIFACT_NAME" > "$CHECKSUM_FILE"
          fi

          echo "checksum_file=$CHECKSUM_FILE" >> $GITHUB_OUTPUT

          # Display checksum for verification
          echo "Generated checksum:"
          cat "$CHECKSUM_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_name }}
          retention-days: 7

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.checksum.outputs.checksum_file }}
          path: ${{ steps.checksum.outputs.checksum_file }}
          retention-days: 7

  build-swift-gui:
    name: Build Swift GUI (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "number=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Building Swift GUI $VERSION (commit: $COMMIT, date: $DATE)"

      - name: Build Go backend
        run: |
          LDFLAGS="-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.Commit=${{ steps.version.outputs.commit }} -X main.Date=${{ steps.version.outputs.date }}"
          go build -ldflags="$LDFLAGS" -o arm-emulator
        env:
          GOOS: darwin
          GOARCH: arm64

      - name: Install dependencies
        run: |
          brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: swift-gui
        run: xcodegen generate

      - name: Build Swift app
        working-directory: swift-gui
        run: |
          xcodebuild -project ARMEmulator.xcodeproj \
            -scheme ARMEmulator \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            MARKETING_VERSION=${{ steps.version.outputs.number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | xcbeautify

      - name: Verify build output
        run: |
          echo "=== Checking swift-gui/build directory ==="
          ls -laR swift-gui/build/ || echo "No build directory found"

      - name: Sign macOS app
        run: |
          codesign --force --deep --sign - swift-gui/build/Build/Products/Release/ARMEmulator.app

      - name: Package Swift app
        id: package
        run: |
          cd swift-gui/build/Build/Products/Release
          ARTIFACT_NAME="arm-emulator-swift-gui.app.tar.gz"
          tar -czf "$ARTIFACT_NAME" ARMEmulator.app
          mv "$ARTIFACT_NAME" ../../../../..
          cd ../../../../..
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          ARTIFACT_NAME="${{ steps.package.outputs.artifact_name }}"
          CHECKSUM_FILE="${ARTIFACT_NAME}.sha256"
          shasum -a 256 "$ARTIFACT_NAME" > "$CHECKSUM_FILE"
          echo "checksum_file=$CHECKSUM_FILE" >> $GITHUB_OUTPUT
          echo "Generated checksum:"
          cat "$CHECKSUM_FILE"

      - name: Upload Swift GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_name }}
          retention-days: 7

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.checksum.outputs.checksum_file }}
          path: ${{ steps.checksum.outputs.checksum_file }}
          retention-days: 7

  build-avalonia-gui:
    name: Build Avalonia GUI (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
          - rid: osx-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            platform: macos-arm64
          - rid: win-x64
            runner: windows-latest
            goos: windows
            goarch: amd64
            platform: win-amd64
          - rid: win-arm64
            runner: windows-latest
            goos: windows
            goarch: arm64
            platform: win-arm64

    env:
      APP_NAME: ARMEmulator
      # The csproj backend-copy targets look for arm-emulator at the repo root.
      # The backend goes elsewhere so they stay inert; this job places it.
      BACKEND_DIR: ${{ github.workspace }}/release-build/backend
      PUBLISH_DIR: ${{ github.workspace }}/release-build/publish
      STAGE_DIR: ${{ github.workspace }}/release-build/stage

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "number=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Building Avalonia GUI $VERSION for ${{ matrix.rid }} (commit: $COMMIT, date: $DATE)"

      - name: Build Go backend
        shell: bash
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          mkdir -p "$BACKEND_DIR"
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.Commit=${{ steps.version.outputs.commit }} -X main.Date=${{ steps.version.outputs.date }}" -o "$BACKEND_DIR/arm-emulator$EXT"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Publish Avalonia app
        shell: bash
        working-directory: avalonia-gui
        run: |
          SINGLE_FILE=false
          [ "${{ matrix.goos }}" = "windows" ] && SINGLE_FILE=true
          dotnet publish ARMEmulator/ARMEmulator.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=$SINGLE_FILE \
            -p:IncludeNativeLibrariesForSelfExtract=$SINGLE_FILE \
            -p:Version=${{ steps.version.outputs.number }} \
            --output "$PUBLISH_DIR"

      - name: Package Linux
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          DIR_NAME="arm-emulator-avalonia-${{ matrix.platform }}"
          mkdir -p "$STAGE_DIR/$DIR_NAME"
          cp -R "$PUBLISH_DIR"/. "$STAGE_DIR/$DIR_NAME/"
          cp "$BACKEND_DIR/arm-emulator" "$STAGE_DIR/$DIR_NAME/"
          chmod +x "$STAGE_DIR/$DIR_NAME/$APP_NAME" "$STAGE_DIR/$DIR_NAME/arm-emulator"
          ARTIFACT_NAME="$DIR_NAME.tar.gz"
          tar -czf "$ARTIFACT_NAME" -C "$STAGE_DIR" "$DIR_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Package macOS
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          APP="$STAGE_DIR/$APP_NAME.app"
          VERSION_NUMBER="${{ steps.version.outputs.number }}"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "$PUBLISH_DIR"/. "$APP/Contents/MacOS/"
          cp "$BACKEND_DIR/arm-emulator" "$APP/Contents/Resources/"
          chmod +x "$APP/Contents/MacOS/$APP_NAME" "$APP/Contents/Resources/arm-emulator"
          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>ARM Emulator</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.armemulator.gui</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION_NUMBER</string>
              <key>CFBundleVersion</key>
              <string>$VERSION_NUMBER</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ARTIFACT_NAME="arm-emulator-avalonia-${{ matrix.platform }}.app.tar.gz"
          tar -czf "$ARTIFACT_NAME" -C "$STAGE_DIR" "$APP_NAME.app"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Package Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $dirName = "arm-emulator-avalonia-${{ matrix.platform }}"
          $dest = Join-Path $env:STAGE_DIR $dirName
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Path (Join-Path $env:PUBLISH_DIR '*') -Destination $dest
          Copy-Item -Path (Join-Path $env:BACKEND_DIR 'arm-emulator.exe') -Destination $dest
          $artifactName = "$dirName.zip"
          Compress-Archive -Path $dest -DestinationPath $artifactName
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          CHECKSUM_FILE="${ARTIFACT_NAME}.sha256"
          if [ "$RUNNER_OS" = "Windows" ]; then
            HASH=$(powershell -Command "(Get-FileHash -Algorithm SHA256 '$ARTIFACT_NAME').Hash.ToLower()")
            echo "$HASH  $ARTIFACT_NAME" > "$CHECKSUM_FILE"
          else
            shasum -a 256 "$ARTIFACT_NAME" > "$CHECKSUM_FILE"
          fi
          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> $GITHUB_ENV
          echo "Generated checksum:"
          cat "$CHECKSUM_FILE"

      - name: Upload Avalonia GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 7

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CHECKSUM_FILE }}
          path: ${{ env.CHECKSUM_FILE }}
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-swift-gui, build-avalonia-gui]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "arm-emulator-*"
          path: artifacts
          merge-multiple: true

      - name: Create combined SHA256SUMS file
        run: |
          cd artifacts

          # Check if any checksum files exist
          if ! ls *.sha256 >/dev/null 2>&1; then
            echo "Error: No checksum files found!"
            exit 1
          fi

          # Combine all checksum files into SHA256SUMS
          cat *.sha256 > SHA256SUMS

          echo "Combined SHA256SUMS file:"
          cat SHA256SUMS

          # Verify SHA256SUMS is not empty
          if [ ! -s SHA256SUMS ]; then
            echo "Error: SHA256SUMS file is empty!"
            exit 1
          fi

          # Remove individual checksum files to avoid cluttering the release
          rm -f *.sha256

          # Count files
          echo "Release artifacts:"
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
